<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Smart Parking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div>
            <p class="eyebrow">Smart Parking</p>
            <h1>Register</h1>
        </div>
        <div class="top-actions">
            <a id="loginNav" href="login.html" class="ghost-link">Login</a>
        </div>
    </header>

    <main class="page auth-page">
        <section class="panel auth-card">
            <div>
                <p class="eyebrow">Llogaria</p>
                <h2>Krijo llogari</h2>
            </div>

            <form id="registerForm" autocomplete="off">
                <label for="registerName">Emri dhe mbiemri</label>
                <input id="registerName" type="text" name="smart-parking-register-name" autocomplete="off" placeholder="Emri dhe mbiemri" required>

                <label for="registerEmail">Email</label>
                <input id="registerEmail" type="email" name="smart-parking-register-email" autocomplete="off" placeholder="email@example.com" required>

                <label for="registerPassword">Password</label>
                <input id="registerPassword" type="password" name="smart-parking-register-password" autocomplete="new-password" minlength="4" placeholder="Password" required>

                <button type="submit">Regjistrohu</button>
            </form>

            <p class="auth-switch">
                Ke llogari? <a href="login.html">Kycu</a>
            </p>
        </section>

        <p id="message" class="message" role="status"></p>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
